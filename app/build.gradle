plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}
def visionApiKey = localProperties.getProperty('VISION_API_KEY', '')
def visionApiKey2 = localProperties.getProperty('VISION_API_KEY_2', '')
def visionApiKey3 = localProperties.getProperty('VISION_API_KEY_3', '')
def cloudinaryCloudName = localProperties.getProperty('CLOUDINARY_CLOUD_NAME', '')
def cloudinaryUploadPreset = localProperties.getProperty('CLOUDINARY_UPLOAD_PRESET', '')

android {
    namespace 'com.example.finfit'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.finfit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // --- Mã nguồn từ GitHub của bạn bạn (Module Assistant/Finance) ---
        // Đọc API key từ local.properties (không commit lên git)
        def githubProperties = new Properties()
        def githubPropertiesFile = rootProject.file('local.properties')
        if (githubPropertiesFile.exists()) {
            githubPropertiesFile.withInputStream { githubProperties.load(it) }
        }
        buildConfigField "String", "GEMINI_API_KEY", "\"${githubProperties['GEMINI_API_KEY'] ?: ''}\""

        // --- Mã nguồn tại máy của bạn (Module Health) ---
        buildConfigField "String", "VISION_API_KEY", "\"${visionApiKey}\""
        buildConfigField "String", "VISION_API_KEY_2", "\"${visionApiKey2}\""
        buildConfigField "String", "VISION_API_KEY_3", "\"${visionApiKey3}\""
        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"${cloudinaryCloudName}\""
        buildConfigField "String", "CLOUDINARY_UPLOAD_PRESET", "\"${cloudinaryUploadPreset}\""
        
        // Airtable
        buildConfigField "String", "AIRTABLE_PAT", "\"${localProperties.getProperty('AIRTABLE_PAT', '')}\""
        buildConfigField "String", "AIRTABLE_BASE_ID", "\"${localProperties.getProperty('AIRTABLE_BASE_ID', '')}\""
        buildConfigField "String", "AIRTABLE_TABLE_ID", "\"${localProperties.getProperty('AIRTABLE_TABLE_ID', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.6.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    
    // Thêm Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.8.0"

    // Room Database
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    implementation platform('com.google.firebase:firebase-bom:33.8.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Google Activity Recognition API
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // UI & Animations
    implementation libs.lottie.compose
    implementation libs.coil.compose
    implementation libs.vico.compose.m3
    implementation libs.vico.views

    // ML Kit - OCR chụp bill (on-device, không cần API)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // CameraX
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // TensorFlow Lite
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

    // Retrofit & Gson for Edamam API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Cloudinary
    implementation 'com.cloudinary:cloudinary-android:3.0.2'

    // Compose RichText for beautiful Markdown parsing
    implementation("com.halilibo.compose-richtext:richtext-ui-material3:0.17.0")
    implementation("com.halilibo.compose-richtext:richtext-commonmark:0.17.0")
}
